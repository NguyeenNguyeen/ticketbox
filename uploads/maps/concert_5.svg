<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F0E17" />
    </radialGradient>
    
    <!-- Stage Glow -->
    <linearGradient id="stageGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- SVIP Gradient -->
    <linearGradient id="svipGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Shadow -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bgGlow)" rx="24"/>

  <!-- Stage Area -->
  <g transform="translate(0, 50)">
    <!-- Stage shape -->
    <path d="M 200 150 Q 500 200 800 150 L 750 50 Q 500 80 250 50 Z" fill="#181825" stroke="url(#stageGlow)" stroke-width="4"/>
    <!-- Stage Text -->
    <text x="500" y="115" font-family="'Inter', sans-serif" font-size="28" fill="#FFFFFF" font-weight="900" letter-spacing="8" text-anchor="middle">MAIN STAGE</text>
    
    <!-- Stage lights / dots -->
    <circle cx="280" cy="120" r="4" fill="#3B82F6" />
    <circle cx="380" cy="135" r="4" fill="#3B82F6" />
    <circle cx="500" cy="140" r="4" fill="#3B82F6" />
    <circle cx="620" cy="135" r="4" fill="#3B82F6" />
    <circle cx="720" cy="120" r="4" fill="#3B82F6" />
  </g>

  <!-- SVIP Interactive Zone -->
  <g id="SVIP">
    <!-- SVIP Area Path -->
    <path d="M 150 400 Q 500 550 850 400 L 780 650 Q 500 800 220 650 Z" fill="url(#svipGradient)" stroke="#FCD34D" stroke-width="3" filter="url(#neonShadow)"/>
    
    <!-- SVIP Text -->
    <text x="500" y="520" font-family="'Inter', sans-serif" font-size="48" fill="#FFFFFF" font-weight="900" letter-spacing="16" text-anchor="middle">SVIP</text>
    <text x="500" y="560" font-family="'Inter', sans-serif" font-size="18" fill="#FEF3C7" font-weight="600" letter-spacing="4" text-anchor="middle">PREMIUM LOUNGE</text>

    <!-- Decorative Rows (simulating seats) -->
    <g opacity="0.3">
      <path d="M 250 450 Q 500 580 750 450" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 15" stroke-linecap="round"/>
      <path d="M 270 510 Q 500 640 730 510" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 15" stroke-linecap="round"/>
      <path d="M 290 570 Q 500 700 710 570" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 15" stroke-linecap="round"/>
    </g>
  </g>

</svg>
