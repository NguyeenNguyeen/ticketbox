server:
  port: 8080

spring:
  application:
    name: ticketbox-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketbox}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 1 day in ms

ticketbox:
  rate-limit:
    # Set to false to disable rate limiting entirely (useful for local development)
    enabled: true
    # Public API tier: limits unauthenticated requests by client IP
    public:
      capacity: 100
      refill-tokens: 100
      refill-duration-seconds: 60
    # Private API tier: limits authenticated requests by username (from JWT)
    private:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    # Paths that completely bypass rate limiting
    whitelisted-paths:
      - /actuator/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /error
      - /favicon.ico
      - /static/**
